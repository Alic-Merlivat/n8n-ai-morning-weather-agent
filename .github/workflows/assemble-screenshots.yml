name: Assemble project screenshots

on:
  push:
    paths:
      - "tmp/screenshots/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble screenshots
        shell: bash
        run: |
          mkdir -p screenshots
          cat tmp/screenshots/workflow.part* | base64 --decode > screenshots/workflow.png
          cat tmp/screenshots/whatsapp.part* | base64 --decode > screenshots/whatsapp-result.png

      - name: Commit screenshots and clean temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git rm -r tmp/screenshots
          git rm .github/workflows/assemble-screenshots.yml
          git commit -m "Add project screenshots"
          git push
